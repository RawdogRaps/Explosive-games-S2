<!DOCTYPE html>
<html>
<head>
    <title>My Favorite Type of Nation is Discrimination </title>
    <style>
        body { text-align: center; font-family: 'Courier New', Courier, monospace; background: #1a1a1a; color: #00ff00; padding: 50px; }
        .box { border: 2px solid #00ff00; padding: 30px; display: inline-block; min-width: 400px; border-radius: 10px; background: #000; }
        input { padding: 10px; width: 80%; margin: 10px 0; background: #222; color: #00ff00; border: 1px solid #00ff00; font-size: 1.2rem; }
        button { padding: 10px 20px; cursor: pointer; background: #00ff00; color: #000; border: none; font-weight: bold; }

        #image-overlay { display: none; margin-top: 20px; cursor: pointer; }
        #image-overlay img { max-width: 400px; border: 3px solid white; border-radius: 5px; }
        #error-msg { color: red; display: none; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="box">
        <h2 id="riddle-title">Riddle 1 of 10</h2>
        <p id="riddle-text">How Pure was Heisenberg's Meth? (include % sign. ex: 69.7%)</p>

        <div id="input-area">
            <input type="text" id="answer-input" placeholder="TYPE YOUR ANSWER...">
            <br>
            <button onclick="checkAnswer()">SUBMIT ANSWER</button>
            <p id="error-msg">❌ WRONG. TRY AGAIN.</p>
        </div>

        <div id="image-overlay" onclick="nextRiddle()">
            <img id="success-image" src="">
            <p>(CLICK IMAGE TO CONTINUE)</p>
        </div>

        <form id="final-form" method="post" class="hidden">
            <h3>Time For Your FINAL Mission</h3>
            <button type="submit">PROCEED TO LEVEL 3</button>
        </form>
    </div>

    <script>
        const riddles = [
            { q: "How Pure was Heisenberg's Meth? (include % sign. ex: 69.7%)", a: "99.1%", img: "https://i.redd.it/kqj48kc0qtx31.gif" },
            { q: "Type in TITTIES to see some titties", a: "TITTIES", img: "https://preview.redd.it/in-the-wolf-of-wall-street-2013-margot-robbie-being-naked-v0-oay8xi5qmmaa1.jpg?width=640&crop=smart&auto=webp&s=de1650b8bc746e85e41d94ba825bdd42377b7473" },
            { q: "They're loud and obnoxious, they like music that rhymes. They're 13% of the population, and commit half the crimes", a: "NIGGERS", img: "https://i.scdn.co/image/ab67616d0000b273e48ea06d19f343fa0d2c8e56" },
            { q: "What do you call a black man in a 3 piece suit", a: "WILL THE DEFENDANT PLEASE RISE", img: "https://i.makeagif.com/media/1-13-2024/5Vgt5A.gif" },
            { q: "Name 3 Ingredients for Crystal Meth. (Hint: Whitest Kids U'Know)", a: "COUGH SYRUP, IODINE, LYE", img: "https://media1.giphy.com/media/v1.Y2lkPTZjMDliOTUyemkwMGN6M29qZ3NvN3k0OWMxMzZ3cWU4OHJ2bzF5azI0dzhtemtwaSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/OX8mzhfwGrWxi/source.gif" },
            { q: "Jew Jew Jew Jew Jew Jew Jew Jew", a: "ALLAHU AKBAR", img: "https://media.tenor.com/ex-J35EhIBcAAAAM/alex-jones-jew-alexjonesjew.gif" },
            { q: "What is your favorite nation", a: "DISCRIMINATION", img: "https://gifdb.com/images/high/slave-400-x-164-gif-1jmczfcrf2af53z2.gif" },
            { q: "Miqdad have you ever drank alcohol or smoked?", a: "NO", img: "/static/liar_meme.jpg" },
            { q: "Ahmed has 3 lunch boxes. He gives one to Mohammed and another to Hassan. Calculate the radius of the explosion. \n Assume the lunchboxes are filled with c4. You need to consider the change in shape. A sphere has a larger blast radius than a cube due to a more uniform explosion. The size of the explosion falls off exponentially with distance, so double the size doesn't necessarily mean double the radius. Then we have to consider what sort of explosive is being used and trigger device. Ive heard rumors a nuclear reactor can fit into a backpack these days. The lunchbox has measurements of 7 x 4 x 8=224 cubic inches", a: "40", img: "https://media.tenor.com/DLKEiLmz7j4AAAAM/allah-drift.gif" },
            { q: "What did Jamal say", a: "ALLAHU AKBAR NIGGA", img: "https://i1.sndcdn.com/artworks-000221638816-6evq8k-t500x500.jpg" }
        ];

let currentStep = 0;
let canClick = true; // Tracks whether clicking is enabled

function checkAnswer() {
  const userInput = document.getElementById("answer-input").value.toUpperCase().trim();
  const errorMsg = document.getElementById("error-msg");
  const overlay = document.getElementById("image-overlay");
  const promptText = overlay.querySelector("p");

  if (userInput === riddles[currentStep].a) {
    errorMsg.style.display = "none";
    document.getElementById("input-area").style.display = "none";
    document.getElementById("success-image").src = riddles[currentStep].img;
    overlay.style.display = "block";

    // If it's the specific riddle (index 1), lock clicks for 5 seconds
    if (currentStep === 1) {
      canClick = false;
      overlay.style.cursor = "not-allowed";
      promptText.innerText = "(WAIT 5 SECONDS...)";

      setTimeout(() => {
        canClick = true;
        overlay.style.cursor = "pointer";
        promptText.innerText = "(CLICK IMAGE TO CONTINUE)";
      }, 5000);
    } else {
      canClick = true;
      overlay.style.cursor = "pointer";
      promptText.innerText = "(CLICK IMAGE TO CONTINUE)";
    }
  } else {
    errorMsg.style.display = "block";
  }
}

function nextRiddle() {
  if (!canClick) return; // Prevent advancing if timer is active

  currentStep++;
  if (currentStep < riddles.length) {
    document.getElementById("riddle-title").innerText = `Riddle ${currentStep + 1} of 10`;
    document.getElementById("riddle-text").innerText = riddles[currentStep].q;
    document.getElementById("answer-input").value = "";
    document.getElementById("input-area").style.display = "block";
    document.getElementById("image-overlay").style.display = "none";
  } else {
    document.getElementById("riddle-title").innerText = "MASHALLAH!";
    document.getElementById("riddle-text").style.display = "none";
    document.getElementById("image-overlay").style.display = "none";
    document.getElementById("final-form").classList.remove("hidden");
  }
}
    </script>
</body>
</html>
